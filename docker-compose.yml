name: petflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: petflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-petflow_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petflow} -d ${POSTGRES_DB:-petflow_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petflow-network

  redis:
    image: redis:7-alpine
    container_name: petflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  petflow-network:
    driver: bridge
