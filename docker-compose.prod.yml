name: petflow-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: petflow-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petflow-prod-network

  redis:
    image: redis:7-alpine
    container_name: petflow-prod-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-""} --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petflow-prod-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: petflow-prod-api
    restart: always
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - petflow-prod-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: petflow-prod-web
    restart: always
    env_file:
      - .env.production
    depends_on:
      - api
    networks:
      - petflow-prod-network

  nginx:
    image: nginx:1.25-alpine
    container_name: petflow-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - petflow-prod-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  petflow-prod-network:
    driver: bridge
